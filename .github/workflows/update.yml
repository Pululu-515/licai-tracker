name: 每日净值更新

on:
  schedule:
    # GitHub Actions 用 UTC 时间，以下对应北京时间 06:50 与 08:00
    - cron: "50 22 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-nav-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 抓取并归档净值
        run: node scripts/update_daily.mjs --daily

      - name: 生成静态站点
        run: node scripts/export_site.mjs

      - name: 提交归档与站点变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "净值更新 $(date -u -d '+8 hours' +%F)"
            git push
          fi

      - name: 打包站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
